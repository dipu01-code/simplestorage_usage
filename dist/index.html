<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimpleStore To-Do</title>
<style>
  :root { --bg:#f6f5f1; --card:#fff; --ink:#1d1d1b; --muted:#77756f; --line:#e4e2dc; --accent:#2f6f4f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --card:#21211f; --ink:#ecebe6; --muted:#9a988f; --line:#33332f; --accent:#6fbf93; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:560px; margin:48px auto; padding:0 16px; }
  h1 { font-size:28px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  form { display:flex; border-bottom:1px solid var(--line); }
  #new { flex:1; border:0; padding:16px; font:inherit; background:transparent; color:inherit; outline:none; }
  form button { border:0; background:var(--accent); color:#fff; padding:0 20px; font:inherit; cursor:pointer; }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); }
  li span { flex:1; word-break:break-word; }
  li.done span { text-decoration:line-through; color:var(--muted); }
  li input { width:18px; height:18px; accent-color:var(--accent); }
  li button { border:0; background:none; color:var(--muted); font-size:20px; cursor:pointer; }
  li button:hover { color:#c0392b; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:12px 16px; font-size:14px; color:var(--muted); }
  .bar .spacer { flex:1; }
  .bar button { border:1px solid transparent; background:none; color:inherit; padding:4px 10px; border-radius:6px; cursor:pointer; font:inherit; }
  .bar button.active { border-color:var(--line); color:var(--ink); }
  .status { font-size:13px; color:var(--muted); margin:12px 2px; }
  .status.error { color:#c0392b; }
  details { margin-top:24px; font-size:14px; }
  summary { cursor:pointer; color:var(--muted); }
  pre { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; overflow:auto; font-size:12px; }
  #reset { margin-top:8px; border:1px solid var(--line); background:var(--card); color:inherit; padding:6px 12px; border-radius:6px; cursor:pointer; font:inherit; }
</style>
</head>
<body>
<main>
  <h1>To-Do</h1>
  <p class="sub">Built with SimpleStore. Your list survives page reloads.</p>
  <div class="card">
    <form id="form">
      <input id="new" placeholder="What needs doing?" autocomplete="off" autofocus>
      <button type="submit">Add</button>
    </form>
    <ul id="list"></ul>
    <div class="bar">
      <span id="count"></span>
      <span class="spacer"></span>
      <button data-filter="all">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="done">Done</button>
      <button id="clear-done">Clear done</button>
    </div>
  </div>
  <p id="status" class="status"></p>
  <details>
    <summary>What's in storage</summary>
    <pre id="keys"></pre>
    <button id="reset">Clear all app data</button>
  </details>
</main>

</body>
</html>
